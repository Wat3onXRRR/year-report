<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>这一年</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#14120f;
    --fg:#f6f2e9;
    --dim:rgba(246,242,233,.52);
    --line:rgba(246,242,233,.16);
    --accent:#f6f2e9;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  html,body{height:100%}
  body{
    background:#14120f;
    color:#f6f2e9;
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .kicker{
    font-family:var(--sans);
    font-size:12px;letter-spacing:.14em;font-weight:500;
    color:var(--dim);margin-bottom:16px;text-transform:none;
  }
  .say{
    font-family:var(--sans);
    letter-spacing:0;
  }

  #deck{
    height:100%;
    overflow:hidden;
    position:relative;
  }
  section{
    position:absolute;inset:0;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:clamp(26px,6vw,48px) max(22px,calc(50vw - 320px)) clamp(34px,8vw,56px);
    background:var(--bg);
    color:var(--fg);
    isolation:isolate;
    opacity:0;pointer-events:none;
    transition:opacity .5s ease;
  }
  section.active{
    opacity:1;pointer-events:auto;z-index:1;
    transition:opacity .9s cubic-bezier(.22,.61,.36,1);
  }
  section::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.016) 0 1px,transparent 1px 4px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.011) 0 1px,transparent 1px 5px),
      radial-gradient(ellipse at 24% 14%,rgba(255,255,255,.20),transparent 60%),
      radial-gradient(ellipse at 82% 94%,rgba(0,0,0,.06),transparent 56%);
    mix-blend-mode:multiply;
  }
  section > *{position:relative;z-index:1}
  .bgl{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bgl .bg-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .bgl .bg-svg{color:var(--art,currentColor)}
  .bgl .bg-img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:62%;width:auto;display:block;opacity:.55;pointer-events:none}
  .bgl .bg-tint{position:absolute;inset:0;background:var(--art);mix-blend-mode:color;opacity:.45}
  #progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;mix-blend-mode:difference;pointer-events:none}
  #pbar{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;transition:width .45s cubic-bezier(.22,.61,.36,1)}
  #pnum{position:fixed;right:20px;bottom:20px;z-index:60;font-family:var(--sans);font-size:12px;letter-spacing:2px;color:#fff;mix-blend-mode:difference;pointer-events:none}
  section .kicker,section .big,section .say,section .foot,section .frame,section .kinds,section .lr,section .wkrow,.cover .year,.cover .lead{
    opacity:0;transform:translateY(26px);
    transition:opacity .75s cubic-bezier(.22,.61,.36,1),transform .75s cubic-bezier(.22,.61,.36,1)}
  section.in .kicker,section.in .big,section.in .say,section.in .foot,section.in .frame,section.in .kinds,section.in .lr,section.in .wkrow,.cover.in .year,.cover.in .lead{opacity:1;transform:none}
  section.in .kicker,.cover.in .year{transition-delay:.04s}
  section.in .big{transition-delay:.14s}
  section.in .say,.cover.in .lead{transition-delay:.26s}
  section.in .foot,section.in .frame,section.in .kinds,section.in .lr,section.in .wkrow{transition-delay:.38s}
  .bgl .bg-img{animation:bgfloat 9s ease-in-out infinite alternate}
  @keyframes bgfloat{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-12px)}}
  .bgl i{position:absolute;display:block;font-style:normal}
  .bgl.fog::before,
  .bgl.fog::after{content:'';position:absolute;border-radius:50%;filter:blur(46px)}
  .bgl.fog::before{left:-12%;top:10%;width:78%;height:56%;background:var(--fg);opacity:.07}
  .bgl.fog::after{right:-14%;bottom:-6%;width:70%;height:52%;background:var(--fg);opacity:.05}
  .sec.foot2{justify-content:center}
  .idart{
    width:clamp(150px,32vw,208px);margin:26px 0 0;color:var(--fg);
  }
  .idart svg{width:100%;height:auto;display:block}
  .idart img{width:100%;height:auto;display:block}
  .emblem{width:100%;height:auto;display:block;color:var(--fg)}
  .artrow{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
    margin:26px 0 0;max-width:430px;
  }
  .artcell{
    position:relative;aspect-ratio:1/1;border-radius:3px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.09);
    display:flex;align-items:center;justify-content:center;
    color:var(--fg);
  }
  .artcell svg{width:78%;height:78%;display:block}
  .artno{
    position:absolute;left:7px;top:5px;font-size:9px;
    color:var(--dim);letter-spacing:.08em;
  }
  .iddesc{
    font-size:clamp(13px,3.2vw,15px);line-height:2;color:var(--fg);
    opacity:.78;margin:20px 0 0;max-width:26em;letter-spacing:.01em;
  }
  .say2{
    font-size:clamp(19px,4.8vw,25px);line-height:1.55;letter-spacing:-.01em;
    margin:22px 0 0;max-width:17em;
  }
  .splitbar{
    display:flex;height:14px;width:100%;margin:30px 0 12px;
    border-radius:7px;overflow:hidden;background:rgba(255,255,255,.08);
  }
  .splitbar i{display:block}
  .sb-a{background:var(--fg)}
  .sb-b{background:rgba(255,255,255,.22)}
  .splitlg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);letter-spacing:.04em}
  .season{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;height:clamp(180px,32vh,260px);margin:26px 0 0}
  .seacol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:9px}
  .seacol i{display:block;width:100%;max-width:56px;background:rgba(255,255,255,.20);border-radius:2px 2px 0 0}
  .seacol.on i{background:var(--fg)}
  .seacol span{font-size:11.5px;color:var(--dim)}
  .hcurve{width:100%;height:auto;margin:20px 0 0;display:block}
  .hourlist{
    font-family:ui-monospace,Menlo,monospace;font-size:clamp(13px,3vw,16px);
    line-height:2.1;color:var(--fg);opacity:.82;margin:18px 0 0;letter-spacing:.02em;
  }
  .ident .en{
    font-size:clamp(11px,2.6vw,13px);letter-spacing:.42em;
    color:var(--dim);margin-top:8px;
  }
  .ident .cn{
    font-size:clamp(40px,11.5vw,64px);line-height:1.1;
    letter-spacing:-.05em;font-weight:700;margin:6px 0 16px;
  }
  .ident .verdict{
    font-size:15px;line-height:1.75;color:var(--fg);opacity:.9;
    margin-bottom:26px;
  }
  .rareline{margin-bottom:9px}
  .rareline .rt{font-size:12px;letter-spacing:.04em;color:var(--dim)}
  .ident .rareb{height:4px;margin-bottom:32px}
  .lr{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0 28px;align-items:start}
  .lrbox img{width:100%;height:clamp(220px,38vh,400px);object-fit:cover;display:block;border-radius:2px}
  .lrcap{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;font-size:12px;color:var(--dim)}
  .lrcap b{font-weight:600;color:var(--fg)}
  .wkrow{display:flex;gap:8px;align-items:flex-end;height:180px;margin:26px 0 0}
  .wkcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%}
  .wkcol i{display:block;width:100%;background:rgba(246,242,233,.16);border-radius:1px}
  .wkcol.on i{background:var(--fg)}
  .wkl{font-size:11px;color:var(--dim)}
  .halfwrap{margin:30px 0 0}
  .halfbar{display:flex;height:74px;border-radius:2px;overflow:hidden}
  .halfbar .ha{background:var(--fg);opacity:.92}
  .halfbar .hb{background:rgba(246,242,233,.20)}
  .halflab{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--dim)}
  .summary{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    margin:34px 0 0;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);
  }
  .sitem{display:flex;flex-direction:column;gap:5px}
  .sitem .sn{font-size:clamp(17px,4.4vw,22px);line-height:1.1;letter-spacing:-.02em}
  .sitem .sl{font-size:11px;color:var(--dim);letter-spacing:.03em}
  .semk{color:var(--dim);margin-right:4px}
  .big.small2{font-size:clamp(22px,5.4vw,30px);line-height:1.5;letter-spacing:-.01em}
  .semgrid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    margin:26px 0 0;
  }
  .sembox{display:flex;flex-direction:column;gap:7px}
  .semimg{width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:3px;background:rgba(0,0,0,.18)}
  .semimg img{width:100%;height:100%;object-fit:cover;display:block}
  .semcap{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
  .title2{
    font-size:clamp(34px,9vw,52px);line-height:1.14;
    letter-spacing:-.045em;font-weight:700;margin:6px 0 22px;
  }
  .rare{font-size:13px;letter-spacing:.02em;color:var(--fg);opacity:.72;margin-top:2px}
  .rareb{
    height:5px;margin:11px 0 30px;border-radius:3px;
    background:rgba(255,255,255,.14);overflow:hidden;
  }
  .rareb i{display:block;height:100%;background:var(--fg);border-radius:3px}
  .traits{display:flex;flex-direction:column;gap:17px}
  .trait{display:flex;align-items:baseline;gap:13px}
  .trait .tn{font-size:11px;color:var(--dim);letter-spacing:.08em}
  .trait .tt{font-size:15.5px;line-height:1.5}
  .sublabels{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 6px}
  .sublabel{font-size:12px;letter-spacing:.02em;color:var(--fg);padding:6px 13px;border:1px solid var(--dim);border-radius:999px;opacity:.92}
  .bigs{
    font-size:clamp(40px,11vw,64px);line-height:1.16;
    letter-spacing:-.05em;font-weight:700;margin:1vh 0 26px;
  }
  .end .say{font-size:15px;line-height:1.95;color:var(--fg);opacity:.92}
  .end .say2{font-size:15px;line-height:1.95;color:var(--dim);margin-top:20px}
  .end .last{
    font-size:clamp(19px,5vw,24px);margin-top:auto;padding-bottom:6vh;
    letter-spacing:-.01em;
  }
  }

  .stamp{
    position:absolute;
    right:clamp(22px,6vw,40px);
    top:clamp(24px,6vw,44px);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--dim);
  }

  /* 封面 */
  .cover{justify-content:center;background:#14120f}
  .year{
    font-size:clamp(80px,27vw,180px);
    font-weight:800;
    letter-spacing:-.055em;
    line-height:.84;
    margin-bottom:.42em;
  }
  .lead{
    font-size:clamp(19px,4.9vw,24px);
    line-height:1.55;
    font-weight:600;
    max-width:100%;
  }
  .lead b{font-weight:800}
  .sub{
    margin-top:clamp(18px,4.5vw,28px);
    font-size:14px;
    line-height:1.85;
    color:var(--dim);
    max-width:34ch;
  }
  .pick{
    margin-top:clamp(28px,6vw,44px);
    align-self:flex-start;
    background:var(--fg);
    color:var(--bg);
    border:0;
    font:inherit;
    font-size:16px;
    font-weight:700;
    padding:15px 32px 16px;
    border-radius:2px;
    cursor:pointer;
  }
  .pick:active{transform:translateY(1px)}
  .hint{
    margin-top:15px;
    font-size:12.5px;
    color:var(--dim);
    line-height:1.7;
  }

  /* 进度 */
  #loading{
    position:fixed;inset:0;display:none;
    background:#14120f;
    flex-direction:column;
    align-items:center;justify-content:center;
    gap:18px;z-index:20;
  }
  #loading.on{display:flex}
  #loading .bar{width:min(220px,56vw);height:2px;background:rgba(246,242,233,.18);position:relative;overflow:hidden}
  #loading .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#f6f2e9;transition:width .2s linear}
  #loading p{font-size:13px;color:rgba(246,242,233,.55)}#loading .thumbs{display:flex;flex-wrap:wrap;gap:3px;max-width:min(300px,74vw);max-height:112px;overflow:hidden;margin-top:12px;justify-content:center}#loading .thumbs img{width:26px;height:26px;object-fit:cover;border-radius:4px;opacity:.85;background:rgba(246,242,233,.1)}

  /* 内容屏 */
  .kicker{
    font-size:13px;
    color:var(--dim);
    margin-bottom:auto;
    line-height:1.7;
  }
  .big{
    font-size:clamp(50px,16vw,96px);
    font-weight:800;
    letter-spacing:-.045em;
    line-height:1.04;
    margin-bottom:.34em;
  }
  .big small{font-size:.32em;font-weight:700;letter-spacing:0;margin-left:.16em;color:var(--dim)}
  .say{
    font-size:clamp(18px,4.7vw,22px);
    line-height:1.62;
    font-weight:600;
    max-width:15.5em;
  }
  .say em{font-style:normal;box-shadow:inset 0 -.24em 0 rgba(255,255,255,.24)}
  .foot{
    margin-top:auto;
    padding-top:22px;
    font-size:12px;
    color:var(--dim);
    line-height:1.8;
  }

  /* 月份条 */
  .months{
    display:flex;align-items:flex-end;gap:clamp(4px,1.4vw,8px);
    height:clamp(120px,26vh,200px);
    margin:clamp(18px,4vw,28px) 0 clamp(12px,3vw,18px);
  }
  .months div{
    flex:1;background:currentColor;border-radius:1px;
    position:relative;min-height:3px;
    transition:height .8s cubic-bezier(.2,.8,.2,1),opacity .5s;
    opacity:.16;
  }
  .months div.hot{opacity:1}
  .mlabels{display:flex;gap:clamp(4px,1.4vw,8px);font-size:10px;color:var(--dim)}
  .mlabels div{flex:1;text-align:center}

  /* 时刻 */
  .hours{
    display:grid;grid-template-columns:repeat(24,1fr);
    gap:clamp(1px,.6vw,3px);
    height:clamp(60px,14vh,90px);
    align-items:end;
    margin:clamp(20px,5vw,32px) 0 10px;
  }
  .hours i{
    display:block;background:currentColor;opacity:.18;border-radius:1px;
    transition:height .8s cubic-bezier(.2,.8,.2,1),opacity .5s;
  }
  .hours i.on{opacity:1}
  .haxis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}

  /* 颜色 */
  .swatches{
    display:flex;gap:0;margin:clamp(22px,5vw,34px) 0;
    height:clamp(130px,28vh,210px);
    border-radius:2px;overflow:hidden;
  }
  .swatches div{flex:1;display:flex;align-items:flex-end;padding:10px}
  .swatches span{font-size:10.5px;color:rgba(255,255,255,.9);letter-spacing:.04em}

  /* 类型 */
  .kinds{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:clamp(8px,2vw,12px);
    margin:clamp(20px,5vw,30px) 0 0;
  }
  .kind{
    position:relative;border-radius:2px;overflow:hidden;
    aspect-ratio:3/4;background:rgba(255,255,255,.06);
  }
  .kind img{width:100%;height:100%;object-fit:cover;display:block}
  .kind span{
    position:absolute;left:0;right:0;bottom:0;padding:9px 10px 10px;
    font-size:11.5px;font-weight:600;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.72));
    letter-spacing:.02em;
  }

  /* 自己写的一页 —— 手账拼贴 */
  .mypage{padding:0;justify-content:center;overflow:hidden;position:relative}
  .mypage::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.020) 0 1px,transparent 1px 4px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.014) 0 1px,transparent 1px 5px),
      radial-gradient(ellipse at 28% 18%,rgba(255,255,255,.34),transparent 62%),
      radial-gradient(ellipse at 78% 92%,rgba(0,0,0,.055),transparent 58%);
    mix-blend-mode:multiply;
  }
  .mypage .mp{
    position:relative;z-index:2;
    width:100%;max-width:520px;margin:0 auto;
    min-height:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding:clamp(24px,7vw,44px) clamp(22px,6vw,40px);
  }

  /* 相纸 */
  .mypage .shot{
    background:#fffdf6;
    padding:10px 10px 12px;
    box-shadow:0 12px 28px rgba(66,46,26,.24),0 1px 0 rgba(255,255,255,.9) inset;
    position:relative;
  }
  .mypage .shot img{width:100%;display:block;object-fit:cover}

  /* 胶带 */
  .mypage .tape{
    position:absolute;width:84px;height:26px;z-index:4;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 3px,transparent 3px 8px),
      rgba(244,234,208,.72);
    box-shadow:0 1px 4px rgba(60,45,30,.18);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
  }
  .mypage .tape.a{left:-16px;top:-11px;transform:rotate(-11deg)}
  .mypage .tape.b{right:-14px;top:-9px;transform:rotate(9deg);width:66px}
  .mypage .tape.c{left:50%;bottom:-12px;transform:translateX(-50%) rotate(-2deg);width:72px}

  /* 手写 */
  .mypage .txt{
    font-family:var(--sans);
    font-size:clamp(17px,4.7vw,22px);
    line-height:1.85;
    color:inherit;
    margin-top:26px;
    transform:rotate(-.8deg);
    transform-origin:left center;
  }
  .mypage .date{
    font-family:var(--sans);
    font-size:12px;opacity:.62;margin-top:14px;
    transform:rotate(-.8deg);
  }

  /* 贴纸 */
  .mypage .deco{position:absolute;inset:0;pointer-events:none;z-index:5}
  .mypage .deco span{position:absolute;opacity:.94;pointer-events:auto;cursor:grab;touch-action:none}
  .mypage .deco span:active{cursor:grabbing}
  .mypage .deco span .grip{
    position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:50%;
    background:#fffdf6;border:1px solid rgba(90,72,52,.45);cursor:nwse-resize;
    opacity:0;transition:opacity .15s;
  }
  .mypage .deco span:hover .grip,.mypage .deco span.on .grip{opacity:1}
  .mypage .deco .s0{left:-4px;top:6%}
  .mypage .deco .s1{right:-2px;top:20%}
  .mypage .deco .s2{right:6%;bottom:14%}
  .mypage .mp.duo .deco .s0{left:-6px;top:2%}
  .mypage .mp.note .deco .s0{left:-4px;top:4%}

  /* 一：大图 */
  .mypage .mp.full .shot{transform:rotate(-1.4deg)}
  .mypage .mp.full .shot img{max-height:54vh}

  /* 二：双联（错开叠放） */
  .mypage .mp.duo .duowrap{position:relative;padding:6px 0 18px}
  .mypage .mp.duo .shot{position:absolute;width:62%}
  .mypage .mp.duo .shot.a{left:0;top:0;transform:rotate(-3deg);z-index:2}
  .mypage .mp.duo .shot.b{right:0;bottom:0;transform:rotate(2.6deg);z-index:3}
  .mypage .mp.duo .shot img{height:38vh;object-fit:cover}
  .mypage .mp.duo .duowrap:after{
    content:'';display:block;padding-bottom:118%;
  }
  .mypage .mp.duo .txt{position:relative;z-index:6;margin-top:6px}

  /* 三：拍立得（白边宽，手写日期） */
  .mypage .mp.polaroid .shot{
    width:82%;align-self:center;
    padding:12px 12px 52px;
    transform:rotate(-2.2deg);
  }
  .mypage .mp.polaroid .shot img{max-height:44vh}
  .mypage .mp.polaroid .stamp{
    position:absolute;left:14px;bottom:12px;
    font-family:var(--sans);
    font-size:13px;color:rgba(40,30,20,.55);letter-spacing:.06em;
  }
  .mypage .mp.polaroid .txt{text-align:center;margin-top:30px;transform:rotate(-2.2deg)}

  /* 四：出血 */
  .mypage .mp.bleed{padding:0;justify-content:flex-end}
  .mypage .mp.bleed .shot{padding:0;box-shadow:none;position:absolute;inset:0}

    loadTxt.textContent = '正在看你的照片';
    var thumbs = document.querySelector('#loading .thumbs');
    if (thumbs) thumbs.innerHTML = '';
    bar.style.width = '0%';

    var out = [];
    var i = 0;
    var thisYear = new Date().getFullYear();
    var skippedYear = 0;

    function next() {
      if (i >= list.length) { finish(out, skippedYear); return; }
      var f = list[i];
      i++;
      bar.style.width = Math.round(i / list.length * 100) + '%';
      loadTxt.textContent = '正在看你的照片 ' + i + ' / ' + list.length;

      readHead(f, 131072).then(function (buf) {
        var t = buf.byteLength ? exifTime(buf) : null;
        if (!t) t = nameTime(f.name);
        if (t && t.getFullYear() !== thisYear) { skippedYear++; setTimeout(next, 0); return; }
        var sz = parseSize(buf, f.type) || { w: 0, h: 0 };
        var url = URL.createObjectURL(f);
        return makeBitmap(f).then(function (im) {
          if (!im) return null;
          var a = analyze(im);
          a.file = f;
          a.url = url;
          a.time = t;
          a.iw = sz.w || im.naturalWidth || im.width || 0;
          a.ih = sz.h || im.naturalHeight || im.height || 0;
          return a;
        });
      }).then(function (a) {
        if (a) out.push(a);
        if (a && thumbs) { while (thumbs.children.length >= 100) thumbs.removeChild(thumbs.firstChild); var ti = document.createElement('img'); ti.src = a.url; thumbs.appendChild(ti); }
        setTimeout(next, 0);
      }).catch(function () { setTimeout(next, 0); });
    }
    next();
  }

  /* 把不像「拍下来记住的事」的图挑出去：截图、长图、文档、二维码、票据 */
  function junkReason(a) {
    var ar = a.iw / a.ih;
    if (a.ih > 900 && ar < 0.56) return 'shot';      // 手机截图、竖长图
    if (ar < 0.36) return 'long';                    // 滚动长图
    if (ar > 2.7) return 'wide';                     // 全景拼图
    if (a.light > 0.90 && a.sat < 0.07) return 'doc';// 白底文档、票据
    if (a.edge > 0.30 && a.sat < 0.13) return 'text';// 文字密集
    var top = Math.max.apply(null, a.hb) / (a.n || 1);
    if (top > 0.88 && a.sat < 0.18 && a.edge < 0.09) return 'flat'; // 二维码、纯色块
    return null;
  }

  function finish(list, skippedYear) {
    if (!list.length) {
      loading.classList.remove('on');
      showModal('没找到照片', '<p>' + (skippedYear ? '这里没有今年的照片。年度总结只看今年拍的，换一个今年的文件夹试试。' : '一张都没读出来。') + '</p>', '好');
      return;
    }

    var thisYear = new Date().getFullYear();
    list.forEach(function (p) { if (!p.time) p.time = new Date(thisYear, 0, 1); });
    var cur = list.filter(function (p) { return p.time.getFullYear() === thisYear; });
    if (cur.length) list = cur;
    list.sort(function (a, b) { return a.time - b.time; });
    S.photos = list;

    var yc = {};
    list.forEach(function (p) { yc[p.time.getFullYear()] = (yc[p.time.getFullYear()] || 0) + 1; });
    S.year = +Object.keys(yc).sort(function (a, b) { return yc[b] - yc[a]; })[0];

    var total = 0, L = 0, Sa = 0, hb = new Array(12).fill(0);
    var months = new Array(12).fill(0), hours = new Array(24).fill(0);
    var days = {};

    list.forEach(function (p) {
      if (p.time.getFullYear() !== S.year) return;
      total++;
      months[p.time.getMonth()]++;
      hours[p.time.getHours()]++;
      L += p.light; Sa += p.sat;
      p.kind = classify(p);
      for (var k = 0; k < 12; k++) hb[k] += p.hb[k];
      var dk = pad2(p.time.getMonth() + 1) + '-' + pad2(p.time.getDate());
      (days[dk] = days[dk] || []).push(p);
    });

    if (!total) { total = list.length; }

    var kindCount = {}, kindSample = {};
    list.forEach(function (p) {
      if (!p.kind) p.kind = classify(p);
      kindCount[p.kind] = (kindCount[p.kind] || 0) + 1;
      if (!kindSample[p.kind]) kindSample[p.kind] = p;
    });
    S.kinds = Object.keys(kindCount)
      .map(function (k) { return { k: k, n: kindCount[k], p: kindSample[k] }; })
      .sort(function (a, b) { return b.n - a.n; });
    S.total = total;

    S.months = months;
    S.hours = hours;
    S.light = total ? L / total : 0.5;
    S.sat = total ? Sa / total : 0.4;
    S.hues = hb;
    S.days = days;

    /* 给身份分类用的补充统计 */
    var wk = 0, we = 0, halfA = 0, halfB = 0, filesz = 0;
    list.forEach(function (p) {
      var dow = p.time.getDay();
      if (dow === 0 || dow === 6) we++; else wk++;
      if (p.time.getMonth() < 6) halfA++; else halfB++;
      filesz += (p.file && p.file.size) || 0;
    });
    S.wk = wk; S.we = we;
    S.weekendPct = total ? we / total : 0;
    S.weekdayPct = total ? wk / total : 0;
    S.halfA = total ? halfA / total : 0.5;
    S.halfB = total ? halfB / total : 0.5;
    S.avgSize = total ? filesz / total : 0;

    // 最长空档
    var gap = 0, prev = null;
    list.forEach(function (p) {
      if (prev) gap = Math.max(gap, Math.round((p.time - prev) / 86400000));
      prev = p.time;
    });
    S.maxGap = gap;

    /* 四季 */
    var seas = [0, 0, 0, 0];
    list.forEach(function (p) {
      var m = p.time.getMonth();
      seas[m < 2 ? 3 : m < 5 ? 0 : m < 8 ? 1 : m < 11 ? 2 : 3]++;
    });
    S.seasons = seas;

    /* 城里还是山里：绿蓝算自然，其余算城 */
    var natural = 0;
    list.forEach(function (p) {
      var green = (p.hb[3] + p.hb[4] + p.hb[5] + p.hb[6] + p.hb[7]) || 0;
      var blue = (p.hb[8] + p.hb[9] + p.hb[10]) || 0;
      if ((green + blue) / Math.max(1, p.hb.reduce(function (a, b) { return a + b; }, 0)) > 0.46) natural++;
    });
    S.naturalPct = total ? natural / total : 0;

    /* 有人的比例 */
    var withPeople = 0;
    list.forEach(function (p) { if (tagIsPerson(p)) withPeople++; });
    S.peoplePct = total ? withPeople / total : 0;

    /* 横着拍还是竖着拍 */
    var land = 0;
    list.forEach(function (p) { if (p.iw >= p.ih) land++; });
    S.landPct = total ? land / total : 0.5;

    /* 对称 / 留白 / 室内 / 自拍 / 特写 占比（新维度） */
    var symC = 0, whiteC = 0, indoorC = 0, selfieC = 0, closeC = 0;
    list.forEach(function (p) {
      if (p.sym > 0.72) symC++;
      if (p.white > 0.42) whiteC++;
      if (p.light < 0.52) indoorC++;
      if (p.skin > 0.28 && p.center > 0.08) selfieC++;
      if (p.center > 0.16) closeC++;
    });
    S.symPct = total ? symC / total : 0;
    S.whitePct = total ? whiteC / total : 0;
    S.indoorPct = total ? indoorC / total : 0;
    S.selfiePct = total ? selfieC / total : 0;
    S.closePct = total ? closeC / total : 0;
    S.cityPct = total ? 1 - S.naturalPct : 0;

    /* 连拍：两张之间不到 12 秒算一组 */
    var burstGroups = 0, burstShots = 0, run = 0;
    for (var bi2 = 1; bi2 < list.length; bi2++) {
      var dt2 = (list[bi2].time - list[bi2 - 1].time) / 1000;
      if (dt2 <= 12) { run++; } else { if (run >= 2) { burstGroups++; burstShots += run + 1; } run = 0; }
    }
    if (run >= 2) { burstGroups++; burstShots += run + 1; }
    S.burstShots = burstShots;
    S.burstPct = total ? burstShots / total : 0;

    /* 从没拍过的钟点 */
    var emptyH = [];
    for (var hh = 0; hh < 24; hh++) if (!S.hours[hh]) emptyH.push(hh);
    S.emptyHours = emptyH;

    /* 每小时的色调：暖冷与亮度 */
    var hc = [];
    for (var h3 = 0; h3 < 24; h3++) {
      var sumH = 0, cntH = 0, sumL = 0;
      list.forEach(function (p) {
        if (p.time.getHours() === h3) { sumH += p.h; cntH++; sumL += p.light; }
      });
      hc.push(cntH ? { h: sumH / cntH, l: sumL / cntH, n: cntH } : null);
    }
    S.hourColor = hc;

    // 主色占比
    S.topShare = (hb.reduce(function (a, b) { return a + b; }, 0))
      ? Math.max.apply(null, hb) / hb.reduce(function (a, b) { return a + b; }, 0) : 0;

    var best = null, bestN = 0;
    Object.keys(days).forEach(function (k) {
      if (days[k].length > bestN) { bestN = days[k].length; best = k; }
    });
    S.peakDay = best;
    S.peakDayCount = bestN;

    var small = null, smallN = 1e9;
    Object.keys(days).forEach(function (k) {
      if (k === best) return;
      var n = days[k].length;
      if (n > 0 && n < smallN) { smallN = n; small = k; }
    });
    S.quietDay = small;

    // 三个主色相
    var idx = hb.map(function (v, i) { return [v, i]; })
      .sort(function (a, b) { return b[0] - a[0]; })
      .slice(0, 3);
    S.top = idx;

    buildTags();
    loading.classList.remove('on');
    render();
    if (!SEM_DONE) setTimeout(runSemantic, 900);
  }

  /* ---------- 人设 ---------- */
  function buildTags() {
    var t = [];
    var night = 0, eve = 0;
    for (var h = 0; h < 24; h++) {
      if (h >= 22 || h < 3) night += S.hours[h];
      if (h >= 17 && h <= 20) eve += S.hours[h];
    }
    var nightR = night / S.total, eveR = eve / S.total;

    var maxM = Math.max.apply(null, S.months), minM = Math.min.apply(null, S.months);
    var sumM = S.months.reduce(function (a, b) { return a + b; }, 0);
    var spread = 0;
    S.months.forEach(function (v) { if (v > sumM * 0.02) spread++; });

    if (nightR > 0.18) t.push({ k: '夜行', s: '你的照片里，晚上十点以后拍的占了 ' + Math.round(nightR * 100) + '%。' });
    else if (eveR > 0.26) t.push({ k: '黄昏档', s: '一天里你最常按快门的时段，是太阳快下山那阵子。' });

    if (spread >= 10) t.push({ k: '月月有', s: '十二个月里你有 ' + spread + ' 个月留下了照片，没断过。' });
    else if (spread <= 5) t.push({ k: '扎堆型', s: '你的照片几乎挤在 ' + spread + ' 个月里，剩下的大半年像没发生过。' });

    if (S.sat > 0.42) t.push({ k: '吃颜色', s: '你偏爱的画面饱和度偏高，灰扑扑的东西不太入你的眼。' });
    else if (S.sat < 0.22) t.push({ k: '吃素色', s: '你拍的照片整体很淡，像蒙了一层雾。' });

    if (S.light > 0.56) t.push({ k: '亮着', s: '你的画面平均偏亮，暗调的很少。' });
    else if (S.light < 0.4) t.push({ k: '调子低', s: '你拍的东西平均偏暗，多数是在不够亮的地方按的快门。' });

    if (S.peakDayCount >= 30) t.push({ k: '一天爆' });
    if (S.total >= 800) t.push({ k: '存图癖' });
    if (S.total < 120) t.push({ k: '省着拍' });

    S.tags = t;
  }

  /* ---------- 渲染 ---------- */
  function hueName(i) {
    var names = ['红', '橙红', '橙黄', '黄', '黄绿', '绿', '青绿', '青', '蓝', '蓝紫', '紫', '品红'];
    return names[i] || '杂色';
  }

  function hueColor(i) {
    return 'hsl(' + (i * 30 + 15) + ',52%,52%)';
  }

  function maxOf(a) { return Math.max.apply(null, a) || 1; }

  function tint(sec, h, s, l, dark) {
    sec.style.setProperty('--bg', 'hsl(' + h + ',' + s + '%,' + l + '%)');
    sec.style.setProperty('--art', 'hsl(' + h + ',' + Math.round(s * 0.45) + '%,' + (dark ? 26 : 56) + '%)');
    if (dark) {
      sec.style.setProperty('--fg', '#14120f');
      sec.style.setProperty('--dim', 'rgba(20,18,15,.52)');
    } else {
      sec.style.setProperty('--fg', '#f6f2e9');
      sec.style.setProperty('--dim', 'rgba(246,242,233,.56)');
    }
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  /* 封面：还没选照片时也先站在这里 */
  function monthDay(t) {
    return (t.getMonth() + 1) + ' 月 ' + t.getDate() + ' 日';
  }

  /* 每屏的背景：主色打底，上面浮一层和这屏情绪对得上的东西 */
  /* ---------- 背景：SVG 描轮廓，viewBox 跟着视口比例走 ---------- */

  function rnd(seed) {
    var x = Math.sin(seed * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function bgSize() {
    var w = 1000;
    var h = Math.round(1000 * (window.innerHeight / Math.max(1, window.innerWidth)));
    h = Math.max(700, Math.min(2600, h));
    return { w: w, h: h };
  }

  // 城市天际线：楼在下方三分之一
  function citySkyline(uid, W, H) {
    var baseY = H;
    var maxH = H * 0.34;
    var bars = [];
    var x = -30, i = 0;
    while (x < W + 30) {
      var bw2 = 44 + rnd(uid + i * 3.1) * 70;
      var bh2 = maxH * (0.28 + rnd(uid + i * 7.7) * 0.72);
      bars.push({ x: x, w: bw2, h: bh2, i: i });
      x += bw2 + 5 + rnd(uid + i * 11.3) * 14;
      i++;
    }

    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    out += '<defs><linearGradient id="fg' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0" stop-color="currentColor" stop-opacity="0"/>' +
           '<stop offset="1" stop-color="currentColor" stop-opacity=".26"/></linearGradient></defs>';

    bars.forEach(function (b) {
      var top = baseY - b.h;
      out += '<path d="M' + b.x.toFixed(0) + ' ' + baseY + ' V' + top.toFixed(0) +
             ' H' + (b.x + b.w).toFixed(0) + ' V' + baseY + ' Z" fill="currentColor" fill-opacity=".07"/>';
      var r1 = rnd(uid + b.i * 5.7);
      if (r1 > 0.64) {
        var tw = b.w * 0.30, th = 10 + rnd(uid + b.i * 2.3) * 12;
        out += '<path d="M' + (b.x + b.w * 0.5 - tw / 2).toFixed(0) + ' ' + top.toFixed(0) +
               ' v-' + th.toFixed(0) + ' h' + tw.toFixed(0) + ' v' + th.toFixed(0) +
               ' Z" fill="currentColor" fill-opacity=".13"/>';
      } else if (r1 > 0.36) {
        var ax = b.x + b.w * (0.3 + rnd(uid + b.i * 4.1) * 0.4);
        out += '<path d="M' + ax.toFixed(0) + ' ' + top.toFixed(0) + ' V' +
               (top - 20 - rnd(uid + b.i * 8.9) * 22).toFixed(0) +
               '" stroke="currentColor" stroke-opacity=".15" stroke-width="1.6" fill="none"/>';
      }
      var cols = Math.max(2, Math.floor(b.w / 26));
      var rows = Math.max(2, Math.floor(b.h / 34));
      for (var c = 0; c < cols; c++) {
        for (var r2 = 0; r2 < rows; r2++) {
          if (rnd(uid + b.i * 13.1 + c * 3.7 + r2 * 1.9) > 0.78) {
            var wx = b.x + 8 + c * ((b.w - 16) / cols);
            var wy = top + 12 + r2 * ((b.h - 18) / rows);
            out += '<rect x="' + wx.toFixed(0) + '" y="' + wy.toFixed(0) +
                   '" width="6" height="9" fill="currentColor" fill-opacity=".38"/>';
          }
        }
      }
    });
    out += '<rect x="0" y="' + (baseY - maxH * 0.9).toFixed(0) + '" width="' + W +
           '" height="' + (maxH * 0.9).toFixed(0) + '" fill="url(#fg' + uid + ')"/>';
    out += '</svg>';
    return out;
  }

  // 一扇窗：十字框 + 窗外楼 + 玻璃反光
  function windowView(uid, W, H) {
    var GY = H * 0.60;
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    out += '<defs>';
    out += '<linearGradient id="gl' + uid + '" x1="0" y1="0" x2="1" y2="1">' +
           '<stop offset="0" stop-color="currentColor" stop-opacity=".06"/>' +
           '<stop offset=".55" stop-color="currentColor" stop-opacity="0"/>' +
           '<stop offset="1" stop-color="currentColor" stop-opacity=".045"/></linearGradient>';
    out += '<linearGradient id="fg' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0" stop-color="currentColor" stop-opacity="0"/>' +
           '<stop offset="1" stop-color="currentColor" stop-opacity=".30"/></linearGradient>';
    out += '</defs>';
    out += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="url(#gl' + uid + ')"/>';

    var bx = -30, bi = 0;
    while (bx < W + 30) {
      var bw2 = 34 + rnd(uid + bi * 3.7) * 62;
      var bh2 = GY * (0.20 + rnd(uid + bi * 8.3) * 0.52);
      out += '<path d="M' + bx.toFixed(0) + ' ' + GY.toFixed(0) + ' V' + (GY - bh2).toFixed(0) +
             ' H' + (bx + bw2).toFixed(0) + ' V' + GY.toFixed(0) + ' Z" fill="currentColor" fill-opacity=".09"/>';
      var wcw = Math.max(1, Math.floor(bw2 / 30));
      var wrh = Math.max(1, Math.floor(bh2 / 34));
      for (var wc = 0; wc < wcw; wc++) {
        for (var wr = 0; wr < wrh; wr++) {
          if (rnd(uid + bi * 9.1 + wc * 2.3 + wr * 5.7) > 0.70) {
            out += '<rect x="' + (bx + 7 + wc * ((bw2 - 14) / wcw)).toFixed(0) +
                   '" y="' + (GY - bh2 + 9 + wr * ((bh2 - 12) / wrh)).toFixed(0) +
                   '" width="5" height="8" fill="currentColor" fill-opacity=".26"/>';
          }
        }
      }
      bx += bw2 + 4 + rnd(uid + bi * 6.1) * 12;
      bi++;
    }
    out += '<rect x="0" y="' + (GY - GY * 0.5).toFixed(0) + '" width="' + W +
           '" height="' + (GY * 0.5).toFixed(0) + '" fill="url(#fg' + uid + ')"/>';
    out += '<path d="M' + (W / 2) + ' 0 V' + H + '" stroke="currentColor" stroke-opacity=".16" stroke-width="10"/>';
    out += '<path d="M0 ' + GY.toFixed(0) + ' H' + W + '" stroke="currentColor" stroke-opacity=".16" stroke-width="10"/>';
    out += '<path d="M' + (W * 0.18).toFixed(0) + ' ' + H + ' L' + (W * 0.52).toFixed(0) + ' 0 L' +
           (W * 0.64).toFixed(0) + ' 0 L' + (W * 0.30).toFixed(0) + ' ' + H + ' Z" fill="currentColor" fill-opacity=".05"/>';
    out += '<rect x="0" y="' + (GY + 24).toFixed(0) + '" width="' + W + '" height="1.5" fill="currentColor" fill-opacity=".14"/>';
    out += '</svg>';
    return out;
  }

  // 星空
  function starField(uid, W, H) {
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    for (var i = 0; i < 190; i++) {
      var x = rnd(uid + i * 1.7) * W;
      var y = rnd(uid + i * 5.3) * H;
      var r = 0.8 + rnd(uid + i * 9.1) * 2.1;
      var op = (0.18 + rnd(uid + i * 3.3) * 0.66).toFixed(2);
      out += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + r.toFixed(1) +
             '" fill="currentColor" fill-opacity="' + op + '"/>';
    }
    for (var j = 0; j < 6; j++) {
      var sx = rnd(uid + j * 17.3) * W;
      var sy = rnd(uid + j * 23.7) * H;
      out += '<g stroke="currentColor" stroke-opacity=".32" stroke-width="1">' +
             '<path d="M' + (sx - 11).toFixed(0) + ' ' + sy.toFixed(0) + ' H' + (sx + 11).toFixed(0) + '"/>' +
             '<path d="M' + sx.toFixed(0) + ' ' + (sy - 11).toFixed(0) + ' V' + (sy + 11).toFixed(0) + '"/></g>';
      out += '<circle cx="' + sx.toFixed(0) + '" cy="' + sy.toFixed(0) + '" r="2.6" fill="currentColor" fill-opacity=".70"/>';
    }
    out += '</svg>';
    return out;
  }

  // 窗前的人
  function figureAtWindow(uid, W, H) {
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    out += '<path d="M' + (W / 2) + ' 0 V' + (H * 0.82) + '" stroke="currentColor" stroke-opacity=".10" stroke-width="9"/>';
    var cx = W * 0.62, topY = H * 0.52, baseY = H;
    out += '<path d="M' + (cx - W * 0.085).toFixed(0) + ' ' + baseY +
           ' C' + (cx - W * 0.082).toFixed(0) + ' ' + (H * 0.80).toFixed(0) +
           ', ' + (cx - W * 0.068).toFixed(0) + ' ' + (H * 0.62).toFixed(0) +
           ', ' + cx.toFixed(0) + ' ' + (topY + H * 0.02).toFixed(0) +
           ' C' + (cx + W * 0.068).toFixed(0) + ' ' + (H * 0.62).toFixed(0) +
           ', ' + (cx + W * 0.082).toFixed(0) + ' ' + (H * 0.80).toFixed(0) +
           ', ' + (cx + W * 0.085).toFixed(0) + ' ' + baseY + ' Z" fill="currentColor" fill-opacity=".26"/>';
    out += '<circle cx="' + cx.toFixed(0) + '" cy="' + topY.toFixed(0) + '" r="' + (W * 0.048).toFixed(0) +
           '" fill="currentColor" fill-opacity=".26"/>';
    out += '</svg>';
    return out;
  }

  function forestLine(uid, W, H) {
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    out += '<defs><linearGradient id="ff' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0" stop-color="currentColor" stop-opacity="0"/>' +
           '<stop offset="1" stop-color="currentColor" stop-opacity=".24"/></linearGradient></defs>';
    for (var layer = 0; layer < 2; layer++) {
      var baseY = H - H * 0.06 + layer * H * 0.035;
      var op = layer ? 0.15 : 0.08;
      var n2 = Math.ceil(W / 56);
      for (var i = 0; i < n2; i++) {
        var x = i * (W / n2) + rnd(uid + layer * 7 + i * 2.3) * 24 - 10;
        var h = H * (layer ? 0.16 : 0.24) * (0.7 + rnd(uid + layer * 13 + i * 5.1) * 0.6);
        var w = 22 + rnd(uid + layer * 3 + i * 1.7) * 18;
        var d2 = 'M' + x.toFixed(0) + ' ' + baseY.toFixed(0);
        for (var k = 1; k <= 4; k++) {
          var yk = baseY - h * k / 4;
          var wk = w * (1 - k / 5.2);
          d2 += ' L' + (x + wk).toFixed(0) + ' ' + yk.toFixed(0) + ' L' + (x + wk * 0.42).toFixed(0) + ' ' + (yk - h * 0.05).toFixed(0);
        }
        d2 += ' L' + (x + w * 0.2).toFixed(0) + ' ' + (baseY - h).toFixed(0) +
              ' L' + (x - w * 0.2).toFixed(0) + ' ' + (baseY - h).toFixed(0);
        for (var k2 = 4; k2 >= 1; k2--) {
          var yk2 = baseY - h * k2 / 4;
          var wk2 = w * (1 - k2 / 5.2);
          d2 += ' L' + (x - wk2 * 0.42).toFixed(0) + ' ' + (yk2 - h * 0.05).toFixed(0) + ' L' + (x - wk2).toFixed(0) + ' ' + yk2.toFixed(0);
        }
        d2 += ' Z';
        out += '<path d="' + d2 + '" fill="currentColor" fill-opacity="' + op + '"/>';
      }
    }
    out += '<rect x="0" y="' + (H * 0.72).toFixed(0) + '" width="' + W + '" height="' + (H * 0.28).toFixed(0) +
           '" fill="url(#ff' + uid + ')"/>';
    out += '</svg>';
    return out;
  }

  function seaLine(uid, W, H) {
    var hor = H * 0.56;
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    out += '<defs><linearGradient id="wt' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0" stop-color="currentColor" stop-opacity=".18"/>' +
           '<stop offset="1" stop-color="currentColor" stop-opacity=".03"/></linearGradient></defs>';
    out += '<rect x="0" y="' + hor.toFixed(0) + '" width="' + W + '" height="' + (H - hor).toFixed(0) + '" fill="url(#wt' + uid + ')"/>';
    out += '<path d="M0 ' + hor.toFixed(0) + ' H' + W + '" stroke="currentColor" stroke-opacity=".28" stroke-width="1.6"/>';
    for (var i = 0; i < 26; i++) {
      var y = hor + H * 0.03 + rnd(uid + i * 3.7) * (H - hor - H * 0.06);
      var x0 = rnd(uid + i * 7.1) * W * 0.72;
      var len = W * (0.04 + rnd(uid + i * 11.3) * 0.17);
      out += '<path d="M' + x0.toFixed(0) + ' ' + y.toFixed(0) + ' H' + (x0 + len).toFixed(0) +
             '" stroke="currentColor" stroke-opacity=".14" stroke-width="1.4"/>';
    }
    out += '</svg>';
    return out;
  }

  function ridgeLine(uid, W, H) {
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    function ridge(baseY, amp, op, seed) {
      var d2 = 'M0 ' + H + ' L0 ' + baseY.toFixed(0);
      for (var x = 0; x <= W; x += 50) {
        var yy = baseY - Math.sin((x / (W * 0.22)) + seed) * amp - rnd(seed + x) * amp * 0.45;
        d2 += ' L' + x + ' ' + yy.toFixed(0);
      }
      d2 += ' L' + W + ' ' + H + ' Z';
      return { d: d2, op: op };
    }
    var far = ridge(H * 0.60, H * 0.10, 0.07, uid * 0.7);
    var near = ridge(H * 0.72, H * 0.08, 0.13, uid * 1.9);
    out += '<path d="' + far.d + '" fill="currentColor" fill-opacity="' + far.op + '"/>';
    out += '<path d="' + near.d + '" fill="currentColor" fill-opacity="' + near.op + '"/>';
    out += '</svg>';
    return out;
  }

  function cloudBank(uid, W, H) {
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    out += '<defs><filter id="cb' + uid + '" x="-40%" y="-40%" width="180%" height="180%">' +
           '<feGaussianBlur stdDeviation="26"/></filter></defs>';
    out += '<g filter="url(#cb' + uid + ')" opacity=".9">';
    // 云带：每团由 5 个椭圆叠成
    for (var i = 0; i < 5; i++) {
      var cx = W * (0.06 + rnd(uid + i * 5.1) * 0.88);

               '" rx="' + (rr * (0.75 + rnd(uid + i * 7 + k) * 0.55)).toFixed(0) +

  function neonSign(uid, W, H) {
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';
    var xs = [0.09, 0.30, 0.52, 0.76, 0.90];
    xs.forEach(function (fx, i) {

  function railing(uid, W, H) {
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="bg-svg">';

    out += '<path d="M0 ' + topY.toFixed(0) + ' H' + W + '" stroke="currentColor" stroke-opacity=".15" stroke-width="5"/>';

  var MOTION_IO = null;

  function updateProgress() {
    var secs = deck.querySelectorAll('section');
    var n = secs.length;
    var bar = document.getElementById('pbar');
    var num = document.getElementById('pnum');
    if (bar) bar.style.width = ((CUR + 1) / n * 100) + '%';

  }
  function goTo(i) {
    var secs = deck.querySelectorAll('section');
    if (!secs.length) return;
    if (i < 0) i = 0;
    if (i >= secs.length) i = secs.length - 1;
    var prev = secs[CUR];
    CUR = i;
    var next = secs[CUR];
    if (prev) { prev.classList.remove('active'); prev.classList.remove('in'); }
    next.classList.add('active');
    setTimeout(function () { next.classList.add('in'); }, 90);
    updateProgress();
  }
  function ensureProgress() {
    if (!document.getElementById('progress')) {
      var pg = document.createElement('div');
      pg.id = 'progress';
      pg.innerHTML = '<i id="pbar"></i>';
      document.body.appendChild(pg);
      var pn = document.createElement('div');
      pn.id = 'pnum';
      document.body.appendChild(pn);
    }
  }
  function initMotion() {
    ensureProgress();
    var secs = deck.querySelectorAll('section');
    if (!secs.length) return;
    secs.forEach(function (s) { s.classList.remove('active'); s.classList.remove('in'); });
    CUR = 0;
    secs[0].classList.add('active');
    setTimeout(function () { secs[0].classList.add('in'); }, 90);
    updateProgress();
    if (NAV_BOUND) return;
    NAV_BOUND = true;
    var wheelLock = false;
    window.addEventListener('wheel', function (e) {
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(function () { wheelLock = false; }, 700);
      if (e.deltaY > 24) goTo(CUR + 1);
      else if (e.deltaY < -24) goTo(CUR - 1);
    }, { passive: true });
    var tY = null;
    window.addEventListener('touchstart', function (e) { tY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (tY === null) return;
      var dy = e.changedTouches[0].clientY - tY;
      tY = null;
      if (dy < -44) goTo(CUR + 1);
      else if (dy > 44) goTo(CUR - 1);
    }, { passive: true });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') goTo(CUR + 1);
      else if (e.key === 'ArrowUp' || e.key === 'PageUp') goTo(CUR - 1);
    });
  }

      var pool = S.photos.slice();
      if (!pool.length) return;
      var want = Math.min(30, pool.length);
      var step = pool.length / want, bag = [];
      for (var i = 0; i < want; i++) bag.push(pool[Math.floor(i * step)]);

      var res = { landscape: [], animal: [], food: [], object: [], person: [], other: [] };
      var k = 0;

      function ahead() {
        if (k >= bag.length) { buildSemanticScreen(res, bag.length); return; }
        var ph = bag[k++];
        loadOne(ph.url).then(function (im) {
          var key = null;
          if (im) {
            var o = inferOne(im);
            if (o && LABELS && LABELS[o.idx]) {
              key = sceneOf(LABELS[o.idx][1]);
              try { console.log('SEM', o.idx, LABELS[o.idx][1], key, 'skin', ph.skin, 'center', ph.center); } catch (e2) {}
            }
          }
          if (tagIsPerson(ph) && (!key || key === 'object')) key = 'person';
          if (!key) key = 'other';
          res[key].push(ph);
          setTimeout(ahead, 0);
        });
      }
      ahead();
    });
  }

      return '<span class="semk">' + CN[k] + '</span>' + Math.round(res[k].length / total * 100) + '%';
    }).join('　');
    sec.appendChild(el('div', 'big small2', h));

    var grid = el('div', 'semgrid');
    top.forEach(function (k) {
      var box = el('div', 'sembox');
      var im = el('div', 'semimg');
      im.appendChild(imgEl(res[k][0]));
      box.appendChild(im);
      box.appendChild(el('div', 'semcap', CN[k] + ' ' + res[k].length + '/' + total));
      grid.appendChild(box);
    });
    sec.appendChild(grid);

    sec.appendChild(el('p', 'foot', '在这一批里抽了 ' + total + ' 张，认的是大类，认不准具体是谁。'));
    tint(sec, 200, 18, 20);
    var anchorSec = deck.querySelectorAll('section')[5];
    if (anchorSec && anchorSec.nextSibling) deck.insertBefore(sec, anchorSec.nextSibling);
    else deck.appendChild(sec);

  function buildIdent() {
    var old = deck.querySelector('.ident');
    if (old) old.remove();
    var s8ref = deck.querySelector('.cardwrap');
    var y = S.year;
    var bgH = S.top[0] ? S.top[0][1] * 30 + 12 : 38;
    var idc = idCard();
    var s7 = el('section', 'ident');
    s7.appendChild(el('div', 'stamp num', y));
    s7.appendChild(el('p', 'kicker', '从这些照片看'));
    s7.appendChild(el('div', 'en', idc.en));
    s7.appendChild(el('div', 'cn', idc.cn));
    s7.appendChild(el('p', 'verdict', idc.line));
    var art = el('div', 'idart');
    var img = el('img');
    img.src = '_av32/' + idc.key + '.jpg';
    img.alt = idc.cn;
    img.onerror = function () { art.innerHTML = emblemSet(idc.key, idc.rare)[0]; };
    art.appendChild(img);
    s7.appendChild(art);
    if (idc.subs && idc.subs.length) {
      var sl = el('div', 'sublabels');
      idc.subs.forEach(function (sname) { sl.appendChild(el('span', 'sublabel', sname)); });
      s7.appendChild(sl);
    }
    var dBody = DESC[idc.key];
    if (dBody) s7.appendChild(el('p', 'iddesc', dBody));
    var rl = el('div', 'rareline');
    rl.appendChild(el('span', 'rt', '2026 年，这种人占 ' + idc.rare + '%'));
    s7.appendChild(rl);
    var bar = el('div', 'rareb');
    var fill = el('i');
    fill.style.width = Math.max(5, Math.min(100, idc.rare * 2.4)) + '%';
    bar.appendChild(fill);
    s7.appendChild(bar);
    var tb = el('div', 'traits');
    idc.traits.forEach(function (t, i) {
      var row = el('div', 'trait');
      row.appendChild(el('span', 'tn num', pad2(i + 1)));
      row.appendChild(el('span', 'tt', t));
      tb.appendChild(row);
    });
    s7.appendChild(tb);
    var sum = el('div', 'summary');
    [['全年', S.total + ' 张'],
     ['最密的月', (S.months.indexOf(Math.max.apply(null, S.months)) + 1) + ' 月'],
     ['最常的钟点', pad2(S.hours.indexOf(Math.max.apply(null, S.hours))) + ':00']
    ].forEach(function (row) {
      var it = el('div', 'sitem');
      it.appendChild(el('b', 'sn num', row[1]));
      it.appendChild(el('span', 'sl', row[0]));
      sum.appendChild(it);
    });
    s7.appendChild(sum);
    var srcLine = '依据是时间、颜色和月份分布。';
    s7.appendChild(el('p', 'foot', srcLine));
    tint(s7, bgH, 46, 16);
    bgArt(s7, 'ringsvg');
    if (s8ref) deck.insertBefore(s7, s8ref);
    else deck.appendChild(s7);
  }

  function emblemSet(key, rare) {
    var a = AV[key] || AV.blank;
    var W = 220, cx = 110, ground = 196;
    var headR = a.hd * W;

    var headCy = ground - totalH + headR;

    var o = '<svg viewBox="0 0 220 220" class="avsvg">';
    o += '<circle cx="' + cx + '" cy="108" r="96" fill="currentColor" fill-opacity=".055"/>';
    o += '<path d="M30 197 H190" stroke="currentColor" stroke-opacity=".20" stroke-width="2.5" stroke-linecap="round"/>';
    o += propSVG(a.prop, cx);

    var hipY, legs = '';
    if (a.pose === 'sit') {
      hipY = bodyTop + (ground - bodyTop) * 0.42;
      // 坐：两条腿向左右平伸
      legs += '<path d="M' + (cx - shoulder * 0.26) + ' ' + hipY + ' q-26 6 -32 30 l30 4 q4 -18 16 -26 Z" fill="currentColor"/>';
      legs += '<path d="M' + (cx + shoulder * 0.26) + ' ' + hipY + ' q26 6 32 30 l-30 4 q-4 -18 -16 -26 Z" fill="currentColor"/>';
    } else {
      hipY = ground - Math.max(42, totalH * 0.34);
      var lw = Math.max(11, shoulder * 0.34);
      var spread = (a.pose === 'lean' || a.pose === 'reach') ? 16 : 8;
      legs += '<path d="M' + (cx - spread - lw) + ' ' + hipY + ' h' + lw + ' l-3 ' + (ground - hipY) + ' h-' + lw + ' Z" fill="currentColor"/>';
      legs += '<path d="M' + (cx + spread) + ' ' + hipY + ' h' + lw + ' l3 ' + (ground - hipY) + ' h-' + lw + ' Z" fill="currentColor"/>';
    }

    // 腿先画，身体压在上面
    o += legs;
    o += '<path d="M' + (cx - shoulder / 2) + ' ' + bodyTop +
         ' L' + (cx + shoulder / 2) + ' ' + bodyTop +
         ' L' + (cx + shoulder * 0.26) + ' ' + (hipY + 8) +
         ' L' + (cx - shoulder * 0.26) + ' ' + (hipY + 8) + ' Z" fill="currentColor"/>';

  function emblemSVG(key, rare) {
    var seed = 0, i;
    for (i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) % 99991;
    var W = 200, H = 200, cx = 100, cy = 100;

    // 外环：所有身份共有，粗细随稀有度

    out += '<circle cx="' + cx + '" cy="' + cy + '" r="78" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="' + ringW.toFixed(1) + '"/>';

    } else if (mode === 1) {
      // 竖线阵列：像电线或雨
      var n = 7 + (seed % 4);
      for (i = 0; i < n; i++) {
        var x = 42 + i * (116 / (n - 1));
        var top = 40 + ((seed + i * 29) % 60);

        out += '<path d="M' + x.toFixed(0) + ' ' + top + ' V' + bot +

      out += '<path d="M148 148 H96 M52 148 H72" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2.4" stroke-linecap="round"/>';
      out += '<path d="M100 88 L116 104 L100 120 L84 104 Z" fill="currentColor" fill-opacity=".55"/>';

      for (k = 0; k < 6; k++) {

      }
      pts.forEach(function (p4) {
        out += '<circle cx="' + p4[0].toFixed(0) + '" cy="' + p4[1].toFixed(0) + '" r="2.6" fill="currentColor" fill-opacity=".72"/>';
      });
    }
    out += '</svg>';
    return out;

  function idCard() {
    var total = S.total || 1;

    var evenM = 0;
    if (nonEmpty.length > 3) {
      var avg = nonEmpty.reduce(function (a, b) { return a + b; }, 0) / nonEmpty.length;
      evenM = nonEmpty.filter(function (v) { return Math.abs(v - avg) <= Math.max(2, avg * 0.35); }).length;
    }
    var spread = nonEmpty.length ? Math.max.apply(null, nonEmpty) - Math.min.apply(null, nonEmpty) : 0;

    var hueSum = S.hues.reduce(function (a, b) { return a + b; }, 0) || 1;
    var warmN = 0, coolN = 0, hueCount = 0;
    S.hues.forEach(function (v, i) {
      var deg = i * 30;
      if (v > hueSum * 0.03) hueCount++;
      if (deg < 90 || deg >= 330) warmN += v;
      if (deg >= 150 && deg < 300) coolN += v;
    });

    var hotM = S.months.indexOf(Math.max.apply(null, S.months));

    var d = {

      dayPct: 100 - nightPct,
      emptyM: emptyM,

      evenM: evenM,
      spread: spread,
      peakShare: Math.round(S.peakDayCount / total * 100),

      minMonth: nonEmpty.length ? Math.min.apply(null, nonEmpty) : 0,
      hotMonth: hotM + 1,
      hotMonthN: S.months[hotM],

      duskPct: Math.round((S.hours[17]+S.hours[18]+S.hours[19]+S.hours[20])/total*100),
      dawnPct: Math.round((S.hours[4]+S.hours[5]+S.hours[6]+S.hours[7])/total*100),
      noonPct: Math.round((S.hours[11]+S.hours[12]+S.hours[13]+S.hours[14])/total*100),
      sat: S.sat, light: S.light,
      topShare: S.topShare || 0,
      hueCount: hueCount,
      warmPct: warmN / hueSum,
      coolPct: coolN / hueSum,
      hueCn: '偏' + hueName(S.top[0][1]),
      symPct: S.symPct || 0,
      whitePct: S.whitePct || 0,
      indoorPct: S.indoorPct || 0,
      selfiePct: S.selfiePct || 0,
      closePct: S.closePct || 0,
      cityPct: S.cityPct || 0,
      naturalPct: S.naturalPct || 0,
      peoplePct: S.peoplePct || 0,
      landPct: S.landPct || 0.5,
      burstPct: S.burstPct || 0,
      bluePct: (S.hues[7] + S.hues[8] + S.hues[9]) / hueSum,
      sem: S.sem || null
    };

    /* 主身份 + 副标签：每个身份算分，最高的是主身份，过门槛的其余是副标签 */
    var scored = [];
    for (var i = 0; i < TYPE_ORDER.length; i++) {
      var TK = TYPES[TYPE_ORDER[i]];

      var sc = TK.score(d);
      scored.push({ key: TYPE_ORDER[i], sc: sc });
    }
    scored.sort(function (a, b) { return b.sc - a.sc; });
    var main = scored[0];
    var TH = 0.30; // 副标签门槛
    if (!main || main.sc < TH) { main = { key: 'blank', sc: 0 }; }
    var subs = scored.slice(1).filter(function (x) {
      return x.sc >= TH && x.key !== main.key;
    }).slice(0, 3).map(function (x) { return TYPES[x.key]; });

    var T = TYPES[main.key];
    return {
      key: main.key, en: T.en, cn: T.cn, line: T.line, rare: T.rare,
      traits: T.traits(d), score: main.sc,
      subs: subs.map(function (t) { return t.cn; })
    };
  }

  /* 成品页上的贴纸可以拖着挪 */
  function bindStickerDrag(mp, deco, pg) {
    [].forEach.call(deco.children, function (sp) {
      var idx = +sp.dataset.i;
      var mode = null, sx = 0, sy = 0, ox = 0, oy = 0, osz = 38;

      function st() {
        if (!pg.stickers) pg.stickers = [];
        var v = pg.stickers[idx];
        if (typeof v === 'string') {
          v = { k: v, x: parseFloat(sp.style.left) || 0, y: parseFloat(sp.style.top) || 0, s: 38 };
          pg.stickers[idx] = v;
        }
        if (!v) { v = { k: 'star', x: 0, y: 0, s: 38 }; pg.stickers[idx] = v; }
        return v;
      }

      sp.addEventListener('pointerdown', function (e) {
        var onGrip = e.target && e.target.classList && e.target.classList.contains('grip');
        mode = onGrip ? 'size' : 'move';
        sx = e.clientX; sy = e.clientY;
        ox = parseFloat(sp.style.left) || 0;
        oy = parseFloat(sp.style.top) || 0;
        osz = parseFloat(sp.style.width) || 38;
        sp.classList.add('on');
        try { sp.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
        e.stopPropagation();
      });

      sp.addEventListener('pointermove', function (e) {
        if (!mode) return;
        var r = mp.getBoundingClientRect();
        if (mode === 'move') {
          var nx = ox + (e.clientX - sx) / r.width * 100;
          var ny = oy + (e.clientY - sy) / r.height * 100;
          nx = Math.max(-8, Math.min(96, nx));
          ny = Math.max(-8, Math.min(96, ny));
          sp.style.left = nx + '%';
          sp.style.top = ny + '%';
          var v = st(); v.x = nx; v.y = ny;
        } else {
          var d = Math.max(e.clientX - sx, e.clientY - sy);
          var ns = Math.max(20, Math.min(160, osz + d));
          sp.style.width = ns + 'px';
          sp.style.height = ns + 'px';
          var img = sp.querySelector('img');
          if (img) { img.width = ns; img.height = ns; }
          st().s = ns;
        }
      });

      var end = function (e) {
        if (!mode) return;
        mode = null;
        sp.classList.remove('on');
        try { sp.releasePointerCapture(e.pointerId); } catch (err) {}
      };
      sp.addEventListener('pointerup', end);
      sp.addEventListener('pointercancel', end);
    });
  }

      swatches: S.top.map(function (t) { return hueColor(t[1]); }),
      months: S.months,
      peakDay: S.peakDay ? S.year + ' 年 ' + S.peakDay.replace('-', ' 月 ') + ' 日' : '',
      peakN: S.peakDayCount,
      tags: S.tags.slice(0, 4).map(function (t) { return t.k; }),
      pages: S.pages.map(function (p, i) {
        return {
          text: p.text || '',
          n: p.idx.length,
          i: i,
          imgs: (p.shots || []).slice(0, 2)
        };
      })
    };
    return fetch('/api/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); })
      .then(function (j) { shareUrl = j.url; return j.url; })
      .catch(function () { return null; });
  }

  function loadQR(url) {
    return new Promise(function (res) {
      var im = new Image();
      im.onload = function () { res(im); };
      im.onerror = function () { res(null); };
      im.src = '/qr?d=' + encodeURIComponent(url);
    });
  }

  /* ---------- 卡片 ---------- */
  var IMG_CACHE = {};
  function loadPhoto(url) {
    if (IMG_CACHE[url]) return IMG_CACHE[url];
    var im = new Image();
    IMG_CACHE[url] = im;
    im.src = url;
    return im;
  }

  var STK_SRC = {};
  function loadStk(k) {
    if (STK_SRC[k]) return STK_SRC[k];
    var im = new Image();
    STK_SRC[k] = im;
    im.src = (window.STICKERS && window.STICKERS[k]) || '';
    return im;
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  function stickerImg(k, size) {
    var b64 = STICKERS[k];
    if (!b64) return '';
    return '<img src="data:image/png;base64,' + b64 + '" style="width:' + size + 'px;height:' + size + 'px;display:block">';
  }

  function drawCard(cv, qr, SH) {
    SH = SH || { stats: { '总张数': 1, '最密的月': 1, '最常的钟点': 1 }, tpl: 'p4', shots: null, marks: [] };
    var W = 1080;
    var ID = idCard();
    var PAD = 84;
    var hasPhotos = SH.shots && SH.shots.length;
    var nShot = hasPhotos ? SH.shots.length : 0;
    var rows = Math.ceil(Math.max(1, nShot) / 2);

    // 动态高度
    var H = 620 + 150 + (nShot ? rows * 500 + 60 : 0) + 200;
    cv.width = W; cv.height = H;

    var g = cv.getContext('2d');
    var bgH = S.top[0] ? S.top[0][1] * 30 + 12 : 38;
    g.fillStyle = 'hsl(' + bgH + ',28%,14%)';
    g.fillRect(0, 0, W, H);
    var grd = g.createRadialGradient(W * 0.3, 0, 0, W * 0.3, 0, H * 0.7);
    grd.addColorStop(0, 'hsla(' + bgH + ',46%,42%,.22)');
    grd.addColorStop(1, 'hsla(' + bgH + ',46%,42%,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, W, H);

    var yy = 128;
    g.fillStyle = 'rgba(246,242,233,.55)';
    g.font = '600 30px -apple-system,"PingFang SC",sans-serif';
    g.fillText(String(S.year) + '　·　这一年', PAD, yy);

    /* 身份 */
    yy += 96;
    g.fillStyle = '#f6f2e9';
    g.font = '700 34px -apple-system,"PingFang SC",sans-serif';
    g.save();
    g.letterSpacing = '4px';
    g.fillText(ID.en, PAD, yy);
    g.restore();

    yy += 118;
    g.font = '700 116px -apple-system,"PingFang SC",sans-serif';
    g.fillText(ID.cn, PAD - 6, yy);

    yy += 62;
    g.font = '500 34px -apple-system,"PingFang SC",sans-serif';
    g.fillStyle = 'rgba(246,242,233,.74)';
    g.fillText(ID.line, PAD, yy);

    /* 稀有度 */
    yy += 54;
    g.fillStyle = 'rgba(246,242,233,.45)';
    g.font = '500 24px -apple-system,"PingFang SC",sans-serif';
    g.fillText('2026 年，这种人占 ' + ID.rare + '%', PAD, yy);

    yy += 22;
    var barW = W - PAD * 2;
    g.fillStyle = 'rgba(246,242,233,.16)';
    roundRect(g, PAD, yy, barW, 6, 3); g.fill();
    g.fillStyle = '#f6f2e9';
    roundRect(g, PAD, yy, Math.max(24, barW * Math.min(1, ID.rare / 40)), 6, 3); g.fill();

    /* 三条特征 */
    yy += 62;
    ID.traits.forEach(function (t, i) {
      g.fillStyle = 'rgba(246,242,233,.38)';
      g.font = '600 22px ui-monospace,monospace';
      g.fillText(pad2(i + 1), PAD, yy);
      g.fillStyle = 'rgba(246,242,233,.78)';
      g.font = '500 27px -apple-system,"PingFang SC",sans-serif';
      g.fillText(t, PAD + 44, yy);
      yy += 46;
    });

    /* 勾选的统计 */
    var statsOn = Object.keys(SH.stats).filter(function (k) { return SH.stats[k]; });
    if (statsOn.length) {
      yy += 40;
      g.strokeStyle = 'rgba(246,242,233,.14)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(PAD, yy); g.lineTo(W - PAD, yy); g.stroke();
      yy += 76;

      var vals = {
        '总张数': [String(S.total) + ' 张', '全年'],
        '最密的月': [(S.months.indexOf(Math.max.apply(null, S.months)) + 1) + ' 月', '最密的月'],
        '最常的钟点': [pad2(S.hours.indexOf(Math.max.apply(null, S.hours))) + ':00', '最常的钟点'],
        '城里还是山里': [Math.round(S.naturalPct * 100) + '% 自然', '其余在城市'],
        '有没有人': [Math.round(S.peoplePct * 100) + '% 有人', '照片里'],
        '四季': [S.seasons.slice().sort()[3] + ' ' + '最多', '四季里']
      };
      var per = Math.floor((W - PAD * 2) / Math.min(3, statsOn.length));
      statsOn.slice(0, 3).forEach(function (k, i) {
        var v = vals[k] || ['—', k];
        g.fillStyle = '#f6f2e9';
        g.font = '700 56px -apple-system,"PingFang SC",sans-serif';
        g.fillText(v[0], PAD + i * per, yy);
        g.fillStyle = 'rgba(246,242,233,.42)';
        g.font = '500 21px -apple-system,"PingFang SC",sans-serif';
        g.fillText(v[1], PAD + i * per, yy + 34);
      });
      yy += 110;
    }

    /* 照片 */
    if (nShot) {
      var pw = (W - PAD * 2 - 18) / 2;
      var ph = pw * 1.15;
      var pTop = yy + 20;
      SH.shots.forEach(function (p, i) {
        var col = i % 2, row = Math.floor(i / 2);
        var px = PAD + col * (pw + 18);
        var py = pTop + row * (ph + 18);
        var im = IMG_CACHE[p.url];
        if (im && im.complete && im.naturalWidth) {
          var sR = Math.max(pw / im.naturalWidth, ph / im.naturalHeight);
          var dw = im.naturalWidth * sR, dh = im.naturalHeight * sR;
          g.save();
          g.beginPath();
          roundRect(g, px, py, pw, ph, 3);
          g.clip();
          g.drawImage(im, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
          g.restore();
        } else {
          g.fillStyle = 'rgba(246,242,233,.08)';
          roundRect(g, px, py, pw, ph, 3); g.fill();
        }
      });
      yy = pTop + rows * (ph + 18) + 20;
    }

    /* 贴纸 */
    (SH.marks || []).forEach(function (m, i) {
      var b64 = STICKERS[m.k];
      var im = STICKERS_IMG[m.k];
      if (!im || !im.complete) return;
      var sz = m.s * W;
      if (SH.sel === i) {
        g.save();
        g.strokeStyle = 'rgba(246,242,233,.85)';
        g.lineWidth = 3;
        g.setLineDash([8, 6]);
        g.strokeRect(m.x * W - sz / 2 - 12, m.y * H - sz / 2 - 12, sz + 24, sz + 24);
        g.restore();
      }
      g.save();
      g.translate(m.x * W, m.y * H);
      g.rotate((m.r || 0));
      g.drawImage(im, -sz / 2, -sz / 2, sz, sz);
      g.restore();
    });

    /* 页脚 */
    g.fillStyle = 'rgba(246,242,233,.34)';
    g.font = '500 21px -apple-system,"PingFang SC",sans-serif';
    g.fillText('时间取自照片文件，颜色是逐张采样算的。', PAD, H - 70);
  }

  /* ---------- 事件 ---------- */
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) handleFiles(fileInput.files);
    fileInput.value = '';
  });
  var dirInput = document.getElementById('dirfile');
  dirInput.addEventListener('change', function () {
    var imgs = Array.prototype.slice.call(dirInput.files || []).filter(function (f) {
      return /^image\//.test(f.type);
    });
    if (imgs.length) handleFiles(imgs);
    else showModal('没找到图片', '<p>这个文件夹里没找到图片，试试「相机」或 DCIM 里的文件夹。</p>', '好');
    dirInput.value = '';
  });

  // 桌面拖拽
  ['dragover', 'drop'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      e.preventDefault();
      if (t === 'drop' && e.dataTransfer && e.dataTransfer.files.length) {
        handleFiles(e.dataTransfer.files);
      }
    });
  });

  var STICKERS_IMG = {};
  Object.keys(STICKERS).forEach(function (k) {
    var im = new Image();
    im.src = STICKERS[k];
    STICKERS_IMG[k] = im;
  });
  window.STICKERS = STICKERS;
  setTimeout(loadMNet, 400);
window.__YEAR = {
    S: S, handleFiles: handleFiles,
    get modelReady() { return MNET_READY; },
    probe: function (im) { return MNET && MNET_READY ? inferOne(im) : null; },
    load: loadMNet,
    render: function () { return render(); }
  };

  boot();
})();
</script>
</body>
</html>
